<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>swiper-beauty</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- swiperjs css -->
  <link
  rel="stylesheet"
  href="css/swiper.min.css"
/>
<!-- swiperjs 스크립설치 -->
<script src="js/swiper-bundle.min.js"></script>
<style>
  /* 슬라이드의 위치를 확인 */
  .visual-section .swiper-slide {
    position: relative;
  }
  .visual-section .swiper-slide span{
    position: absolute;
    left: 0; top: 0;
    background-color: #fff;
  }
  .visual-section{
    /* .visual-section과 후손에서 사용될 변수선언 */
    --swiper-control-position-bottom: -20px;
    width: 100% !important;
    max-width: 100% !important;
    /* overflow visible상태에서 마지막에 수평스크롤바를 없애고 싶을때 */
    overflow: hidden;
    padding-bottom: 100px;

  }
  .visual-section .swiper {
    /* 설정되어 있는 overflow hidden 문제해결 */
  overflow: visible;
  width: 92%;
  max-width: 1420px;
  /* cafe24 swiper css버전 추가 변경 */
  position: relative;
  margin-left: auto;
  margin-right: auto;

}
.visual-section .swiper-wrapper{
  /* script에 spaceBetween으로 조정 */
  /* gap: 20px; */
}
.visual-section .swiper-slide{
  /* 설정되어 있는 width: 100% 문제해결 */
  /* width: auto; */
  /* swiper view 3개 slide가 표시되게 하고 싶을때(3단) */
  /* width: 33.33%; */
  /* margin-right: 20px; */
  }
  .visual-section .swiper-slide a{
    display: block;
  }
  .visual-section .swiper-slide a img{
    display: block;
    width: 100%;
  }
  .visual-section .swiper-pagination-progressbar{
    /* height: var(--swiper-pagination-progressbar-size, 4px); */
    bottom: var(--swiper-control-position-bottom);
    top: auto;
    width: calc(100% - 120px);
  }
  .visual-section .swiper-pagination-progressbar .swiper-pagination-progressbar-fill{
    background-color: #000;
  }

  .visual-section .swiper-button{
    position: absolute;
    right: 0px;
    opacity: 50%;
    bottom: var(--swiper-control-position-bottom);
    transform: translate(0,50%);
  }
  
  .visual-section .swiper-button>div{
    /* position absolute를 무력화하고 싶을때 */
    position: static;
    /* 수평으로 오면서 너비 높이를 지정하고 싶을때 */
    display: inline-block;
    width: 24px;
    height: 33px;
    position: relative;
    left: auto; right: auto; top: auto; bottom: auto;
  }
  .visual-section .swiper-button .swiper-button-prev,
  .visual-section .swiper-button .swiper-button-next{
    padding-left: 10px;
    padding-right: 10px;
    background-image: none;
  }
  .visual-section .swiper-button .swiper-button-prev::after{
    content: "";
    display: block;
    width: 2px;
    height: 50%;
    background-color: #ccc;
    position: absolute;
    right: -3px; top: 43%;
    transform: translate(0,-50%);
  }

  .visual-section .swiper-button .swiper-button-prev > img,
  .visual-section .swiper-button .swiper-button-next > img{
    width: 100%;
    display: block;
    
  }
  .visual-section .swiper-button .swiper-button-next > img{
    transform: rotate(180deg);
  }
  .visual-section .swiper-button .swiper-button-play-toggle{}
  .visual-section .swiper-button .swiper-button-play-toggle>span{
    display: block;
    padding-left: 100%;
    background-repeat: no-repeat;
    background-size: contain;
    /* box-sizing: border-box; */
    /* border: 1px solid #000; */
    overflow: hidden
  }
  .visual-section .swiper-button .swiper-button-play-toggle .icon-pause{
    background-image: url(images/pause_48dp.png);
    /* background-repeat: no-repeat; */
  }
  .visual-section .swiper-button .swiper-button-play-toggle .icon-play{
    background-image: url(images/play_arrow_48dp.png);
    /* background-repeat: no-repeat; */
  }
  /* .is-play : pause표시
     .is-pause : play표시 */
  .visual-section .swiper-button .swiper-button-play-toggle.is-pause .icon-pause,
  .visual-section .swiper-button .swiper-button-play-toggle.is-play .icon-play{
    display: none;
  }

</style>
</head>
<body>
  <!-- Slider main container -->
<div class="section visual-section">
  <div class="swiper swiper1">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
      <!-- Slides -->
      <div class="swiper-slide">
        <a href="">
          <img src="/beauty/images/swiper-slider/떡솝블루.jpg">
          <span>1번 슬라이드</span>
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="/beauty/images/swiper-slider/수분세럼 블루.jpg">
          <span>2번 슬라이드</span>
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="/beauty/images/swiper-slider/떡솝핑크1.jpg">
          <span>3번 슬라이드</span>
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="/beauty/images/swiper-slider/아렌로션 핑크.jpg">
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="/beauty/images/swiper-slider/아렌세럼 그린1.jpg">
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="/beauty/images/swiper-slider/아렌세럼 그린2.jpg">
        </a>
      </div>
    
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>

    <!-- 컨트롤버튼의 위치를 편리하게 잡기 위해서 -->
    <div class="swiper-button">
      <!-- If we need navigation buttons -->
      <div class="swiper-button-prev">
        <img src="/beauty/images/arrow_back_ios_48.png" alt="이전 슬라이드로 이동">
      </div>
      <div class="swiper-button-next">
        <img src="/beauty/images/arrow_back_ios_48.png" alt="다음 슬라이드로 이동">
      </div>
      <!-- play버튼과 pause 버튼이 올거에요 -->
      <!-- <div>버튼</div> -->
      <div class="swiper-button-play-toggle is-play">
      <span id="icon-pause" class="icon-pause">pause</span>
      <span id="icon-play" class="icon-play">play</span>
      </div>
    </div>
    <!-- //.swiper-button -->
  
    <!-- If we need scrollbar -->
    <!-- <div class="swiper-scrollbar"></div> -->
  </div> <!-- //.swiper -->
</div> <!-- //.visual-section -->

<!-- 외부 myscript.js에서 Swiper 초기화 및 재생/정지 토글을 처리합니다 -->
<script src="/beauty/js/myscript.js" defer></script>
</body>
</html>
