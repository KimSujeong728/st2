<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex3-flex container</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- 
  1. flex 선언 container : 단이 될 요소의 부모
  2. flex의 방향을 결정 container : 주축과 교차축 결정
  3. 아이템의 축소/확장을 결정 item
  4. 아이템의 크기결정 item
  5. 아이템이 줄바꿈을 결정 container 
  6. 여백관리 gap container margin item
  7. 정렬 container / item, margin -->
  <style>
    .wrap{margin: 50px;}
    .container{
      background-color: #fccc;
    }
    .item{
      border: 1px solid #000;
    }
    .flex1{
      /*  */
      width: 300px;
      height: 300px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      /* gap, justify-content, align-content */
      column-gap: 1rem;
      row-gap: 10px;
      /* justify-content: center; */
      /* justify-content: space-around; */
      /* justify-content: space-between; */
      /* justify-content: space-evenly; */
      justify-content: start;
      /* 플렉스 컨테이너의 교차축 크기에 맞춰서 늘어나라 */
      /* align-content: stretch; */
      align-content: start;
      /* align-content: end; */
      /* align-content: center; */
      /* align-content: space-between; */
    }
    .flex1 .item{
      flex-grow: 0;
      flex-shrink: 0;
      width: 80px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- .container>.item*4>{item$} -->
    <div class="container flex1">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>
    <div class="container flex2">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
    </div>
  </div>
</body>
</html>
