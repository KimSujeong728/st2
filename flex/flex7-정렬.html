<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex7-flex item</title>
  <link rel="stylesheet" href="../reset.css">
  <style>
    .wrap{margin: 50px;}
    .container{
      background-color: #fccc;
    }
    .item{
      border: 1px solid #000;
    }
    .flex{
      display: flex;
      min-height: 300px;
      justify-content: space-evenly;
      align-items: center;
    }
    .flex .item{
      flex-grow: 0;
      flex-shrink: 0;
      width: 200px;
      aspect-ratio: 1;
      box-sizing: border-box;
    }
    .flex .item:nth-child(1){flex-grow: 3;}
    .flex .item:nth-child(2){flex-grow: 2; align-self: flex-end;}
    .flex .item:nth-child(3){flex-grow: 1; align-self: flex-start;}
    .flex .item:nth-child(4){flex-grow: 4;}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- .container>.item*4>{item$} -->
    <div class="container flex">
      <div class="item">item1</div>
      <div class="item">item2</div>
      <div class="item">item3</div>
      <div class="item">item4</div>
  </div>
</body>
</html>
