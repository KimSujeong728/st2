<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex에서 margin활용</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- 
  1. flex 선언 container : 단이 될 요소의 부모
  2. flex의 방향을 결정 container : 주축과 교차축 결정, row가 기본값
  3. 아이템의 축소/확장을 결정 item : 축소는 하지만 확장은 하지 않음?
  4. 아이템의 크기결정 item
  5. 아이템이 줄바꿈을 결정 container 
  6. 여백관리 gap container margin item
  7. 정렬 container / item, margin -->
  <style>
    .container{
      background-color: #ccc;
      width: 100%; height: 100vh;
      display: flex;
      /* flex-direction: column; */
      /* justify-content: flex-start; */
      /* align-items: stretch; item의 너비높이 사이즈가 width/height auto일때 적용*/
    }
    .item{
      width: 100px;
      height: 100px;
      /* width: auto; flex item일 때 나의 내용 크기 만큼 너비를 설정 */
      background-color: magenta;
      /* margin: 0 auto; */
      /* margin-top: auto; */
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item">아이템</div>
    <div class="item">아이템</div>
  </div>
</body>
</html>
