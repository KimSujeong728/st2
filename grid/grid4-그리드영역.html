<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid4-그리드영역 grid-area</title>
  <link rel="stylesheet" href="../reset.css">
  <style>
    .wrap{
      display: grid;
      grid-template-rows: 150px minmax(500px, auto) 300px;
      grid-template-columns: 250px 1fr;
      grid-template-areas: 
      "hd hd"
      "lnb mc"
      "footer footer" 
      ;

    }
    .header{
      background-color: #ccc;
      /* 영역명은 변수처럼 사용하니 따옴표를 붙이면 텍스트가 되버림 */
      grid-area: hd;
    }
    aside{
      background-color: #fcc;
      grid-area: lnb;
    }
    .main-content{
      background-color: rgb(147, 228, 164);
      grid-area: mc;
    }
    footer{
      background-color: rgb(177, 155, 253);
      grid-area: footer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>헤더</header>
     <aside>LNB</aside>
     <main class="main-content">페이지내용</main>
      <footer>푸터</footer>
  </div>
</body>
</html>
