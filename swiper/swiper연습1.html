<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>swiper연습1</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- swiperjs css -->
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
<!-- swiperjs 스크립설치 -->
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<style>
  /* visual section이 브라우저 너비를 다 사용하게 하기 */
  /* cafe24가 사용하는 클래스명 동일하게 사용
  메인화면에서 브라우저 전체 너비를 사용할 때 section 요소에 .section_full 추가 */
  .section_full{
    width: 100% !important;
    max-width: 100% !important;
  }
  .visual-section .swiper-slide{}
  .visual-section .swiper-slide a{
    display: block;
  }
  .visual-section .swiper-slide a img{
    display: block;
    width: 100%;
  }
  .visual-section .swiper {
    width: 100%;
    background-color: #f00;
  }
  .visual-section  .swiper-horizontal>.swiper-pagination-bullets, 
      .visual-section  .swiper-pagination-bullets.swiper-pagination-horizontal, 
      .visual-section  .swiper-pagination-custom, 
      .visual-section  .swiper-pagination-fraction{
        bottom:24px;
      }

  .visual-section .swpter .swiper-pagination-bullet{
    background: transparent;
    height: 12px; width: 12px;
    border-radius: 50%;
    height: 4px; width: 12px;
    border-radius: 50%;
    opacity: 0.4;
    margin-right: 1rem;
    border: 2px solid #fff;
  }
  .visual-section .swiper .swiper-pagination-bullet-active{
    background-color: #8f8;
    background-color: #fff;
    opacity: 0.8;
  }
  .visual-section .swiper-button-next,
  .visual-section .swiper-button-prev{
    color: #fff;
    box-shadow: 0px 0px 4px #000;
    padding: 1rem 0.5rem;
    opacity: 0.5;
    transform: translateY(-50%);
  }
  .visual-section .swiper-button-next:hover,
  .visual-section .swiper-button-prev:hover{
    opacity: 1;
  }

  .visual-section .swiper-button-next{
    right: 50px;
    left: auto;
  }
  .visual-section .swiper-button-prev{
    left: 50px;
    right: auto;
  }
  .visual-section .swiper-scrollbar.swiper-scrollbar-horizontal{
    bottom: 0;
  }
    

</style>
</head>
<body>
  <div class="visual-section section_full section">
  <!-- Slider main container -->
  <div class="swiper swiper1">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
      <!-- Slides -->
      <div class="swiper-slide">
        <a href="">
          <img src="../css/images/슬라이드1.png" alt="">
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="../css/images/슬라이드2.png" alt="">
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="../css/images/smartbanner-01-03-pc.png" alt="">
        </a>
      </div>
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>
  
    <!-- If we need navigation buttons -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  
    <!-- If we need scrollbar -->
    <div class="swiper-scrollbar"></div>
  </div>
</div>

<!-- swiperjs를 실행 -->
<script>
  const swiper = new Swiper('.swiper', {
  // Optional parameters
  direction: 'horizontal',
  // 무한반복
  loop: true,
  
  // autoplay
  autoplay: {
        delay: 2000,
        disableOnInteraction: false,
  },

  // If we need pagination
  pagination: {
    el: '.swiper-pagination',
    clickable: true,
  },

  // Navigation arrows
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev',
  },

  // And if we need scrollbar
  scrollbar: {
    el: '.swiper-scrollbar',
    
  },
});
</script>

</body>
</html>
