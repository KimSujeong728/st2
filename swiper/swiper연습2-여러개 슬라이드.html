<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>swiper연습2-여러개 슬라이드 보여주기</title>
  <link rel="stylesheet" href="../reset.css">
  <!-- swiperjs css -->
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
<!-- swiperjs 스크립설치 -->
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<style>
  /* 슬라이드의 위치를 확인 */
  .visual-section .swiper-slide {
    position: relative;
  }
  .visual-section .swiper-slide span{
    position: absolute;
    left: 0; top: 0;
    background-color: #fff;
  }
  .visual-section{
    width: 100% !important;
    max-width: 100% !important;
    /* overflow visible상태에서 마지막에 수평스크롤바를 없애고 싶을때 */
    overflow: hidden;
  }
  .visual-section .swiper {
    /* 설정되어 있는 overflow hidden 문제해결 */
  overflow: visible;
  width: 92%;
  max-width: 1420px;

}
.visual-section .swiper-wrapper{
  /* gap: 20px; */
}
.visual-section .swiper-slide{
  /* 설정되어 있는 width: 100% 문제해결 */
  /* width: auto; */
  /* swiper view 3개 slide가 표시되게 하고 싶을때(3단) */
  /* width: 33.33%; */
  /* margin-right: 20px; */
  }
  .visual-section .swiper-slide a{
    display: block;
  }
  .visual-section .swiper-slide a img{
    display: block;
    width: 100%;
  }
</style>
</head>
<body>
  <!-- Slider main container -->
<div class="section visual-section">
  <div class="swiper swiper1">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
      <!-- Slides -->
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=1">
          <span>1번 슬라이드</span>
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=2">
          <span>2번 슬라이드</span>
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=3">
          <span>3번 슬라이드</span>
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=4">
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=5">
        </a>
      </div>
      <div class="swiper-slide">
        <a href="">
          <img src="https://picsum.photos/400/500?random=6">
        </a>
      </div>
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>
  
    <!-- If we need navigation buttons -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  
    <!-- If we need scrollbar -->
    <div class="swiper-scrollbar"></div>
  </div> <!-- //.swiper -->
</div> <!-- //.visual-section -->
<script>
  const swiper = new Swiper('.swiper', {
  // Optional parameters
  direction: 'horizontal',
  loop: true,
  centeredSlides: true,
  slidesPerView: 3,
  spaceBetween: 20,

  // If we need pagination
  pagination: {
    el: '.swiper-pagination',
  },

  // Navigation arrows
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev',
  },

  // And if we need scrollbar
  scrollbar: {
    el: '.swiper-scrollbar',
    clickable: true,
  },
});
</script>

</body>
</html>
